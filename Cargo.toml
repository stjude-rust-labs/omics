[workspace]
members = [
    "omics",
    "omics-alignment",
    "omics-coordinate",
    "omics-core",
    "omics-molecule",
    "omics-variation",
    "profile",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
edition = "2024"
authors = ["The Omics project developers"]
description = "Foundations for the Rust omics ecosystem"
homepage = "https://github.com/stjude-rust-labs/omics"
repository = "https://github.com/stjude-rust-labs/omics"
rust-version = "1.98.0"

[workspace.dependencies]
anyhow = "1.0.104"
criterion = "0.8.2"
regex = "1.13.1"
string-interner = "0.20.0"
thiserror = "2.0.20"

[workspace.lints.rust]
missing_docs = "warn"
nonstandard-style = "warn"
rust-2018-idioms = "warn"
rust-2021-compatibility = "warn"
rust-2024-compatibility = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"
